services:
  diplomas_mid:
    container_name: diplomas-mid-local
    build:
      context: .
    environment:
      DIPLOMAS_MID_HTTP_PORT: 8090
      FIRMA_ELECTRONICA_MID_URL: ${FIRMA_ELECTRONICA_MID_URL}
      DIPLOMAS_CRUD_URL: ${DIPLOMAS_CRUD_URL}
      ADMINISTRATIVA_AMAZON_API_URL: ${ADMINISTRATIVA_AMAZON_API_URL}
      DOCUMENTOS_CRUD_GESTOR_DOCUMENTAL_URL: ${DOCUMENTOS_CRUD_GESTOR_DOCUMENTAL_URL}
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      DIPLOMAS_S3_BUCKET: diplomas-digital-local
    extra_hosts:
      - "${HOST_SERVICES_DOMAIN}:host-gateway"
    ports:
      - "8090:8090"
